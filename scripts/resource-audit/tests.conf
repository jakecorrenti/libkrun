# Test matrix for run-audit.sh (sourced as bash; see README.md).
#
# Each test is a function test_<name>() setting any of the variables below
# (defaults shown). Test functions run with $TEST_DIR set to the per-test
# directory under the run's results dir — use it to assemble per-test
# artifacts (disk images, rootfs trees). $SCRIPT_DIR points at this
# directory.
#
#   vcpus=1 ram_mib=256 transport=mmio payload=krunfw
#   kernel= kernel_format= initrd= cmdline=      # payload=external
#   firmware=                                     # payload=firmware
#   append_cmdline=                               # extra kernel cmdline args
#   root_mode=nullfs root_dir=                    # nullfs | dir
#   workload=/pause workload_args=(...)           # guest init workload
#   embeds=(HOST_PATH:GUEST_PATH ...)             # nullfs only; the pause
#                                                 # binary is auto-embedded
#                                                 # at the workload path
#   devices="console"                             # comma list from:
#                                                 #   console rng balloon vsock blk net
#   blk_img= blk_format=raw                       # for blk
#   net_socket=                                   # for net (existing passt
#                                                 # unix stream socket)
#   log_path=                                     # libkrun log file
#   ready_marker=AUDIT_GUEST_READY                # "" = fixed settle wait
#   settle=10 duration=10 interval=1              # per-test timing overrides
#   extra_env=(KEY=VAL ...)                       # extra env for the harness
#   strace=1                                      # trace mmap/mprotect/munmap/
#                                                 # open*/prctl (with -k
#                                                 # callstacks when supported)
#                                                 # to strace.log — slows the
#                                                 # boot (raise settle) and
#                                                 # perturbs timing; keep such
#                                                 # runs out of performance
#                                                 # comparisons
#   label_mmap=1                                  # LD_PRELOAD build/mmap-label.so
#                                                 # to name anonymous mmaps
#                                                 # (needs CONFIG_ANON_VMA_NAME;
#                                                 # a silent no-op otherwise)
#
# Payloads:
#   krunfw    kernel + initrd from the libkrunfw.so.5 resolved through
#             LD_LIBRARY_PATH (see README.md for kernel swapping)
#   external  --kernel image (vmlinux etc.), optional --initrd, and a full
#             --cmdline replacement (must include console= and
#             rootfstype=virtiofs for the audit guest to boot)
#   firmware  boots a firmware image directly; no init, rootfs or workload

# The krunfw kernel boots with "quiet" on its command line; append loglevel=7
# so guest-console.log shows the boot. Set COMMON_APPEND_CMDLINE="" for the
# quietest possible measurement, or override append_cmdline in a test.
COMMON_APPEND_CMDLINE="loglevel=7"

test_minimal() {
    vcpus=1
    ram_mib=256
    transport=mmio
    payload=krunfw
    root_mode=nullfs
    devices="console"
}

test_rng-balloon() {
    devices="console,rng,balloon"
}

test_vsock-tsi() {
    # cid 3 with TSI socket hijacking (inet + unix), as in chroot_vm.c
    devices="console,rng,balloon,vsock"
}

test_blk() {
    devices="console,rng,balloon,blk"
    # Sparse 2 GiB raw image: measures queue/metadata cost only — the guest
    # never touches it, so no data pages enter the page cache.
    truncate -s 2G "$TEST_DIR/blk.img"
    blk_img="$TEST_DIR/blk.img"
}

test_scale-2vcpu-1g() {
    vcpus=2
    ram_mib=1024
    devices="console,rng,balloon"
}

test_rootfs-dir() {
    root_mode=dir
    root_dir="$TEST_DIR/rootfs"
    mkdir -p "$root_dir/bin" "$root_dir/dev" "$root_dir/proc" "$root_dir/sys"
    cp "$SCRIPT_DIR/build/pause" "$root_dir/bin/pause"
    workload="/bin/pause"
    devices="console,rng,balloon"
}

