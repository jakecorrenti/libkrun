# Maximal-data matrix: every axis of tests.conf plus the PCI/ACPI and
# external-kernel configurations, with every test phased (pre-boot snapshot
# and boot-cost line) and labeled (mmap/malloc call-site attribution), plus
# a strace attribution run.
#
# One command gathers everything:
#     ./run-audit.sh --config tests-full.conf
#
# The minimal-strace row in summary.md is attribution-only: ptrace perturbs
# timing, so do not compare it against the untraced rows.

COMMON_APPEND_CMDLINE="loglevel=7"

test_minimal() {
    pause_before_run=10
    label_mmap=1
    devices="console"
}

test_rng-balloon() {
    pause_before_run=10
    label_mmap=1
    devices="console,rng,balloon"
}

test_vsock-tsi() {
    pause_before_run=10
    label_mmap=1
    devices="console,rng,balloon,vsock"
}

test_blk() {
    pause_before_run=10
    label_mmap=1
    devices="console,rng,balloon,blk"
    # Sparse 2 GiB raw image: measures queue/metadata cost only — the guest
    # never touches it, so no data pages enter the page cache.
    truncate -s 2G "$TEST_DIR/blk.img"
    blk_img="$TEST_DIR/blk.img"
}

test_scale-2vcpu-1g() {
    pause_before_run=10
    label_mmap=1
    vcpus=2
    ram_mib=1024
    devices="console,rng,balloon"
}

test_rootfs-dir() {
    pause_before_run=10
    label_mmap=1
    root_mode=dir
    root_dir="$TEST_DIR/rootfs"
    mkdir -p "$root_dir/bin" "$root_dir/dev" "$root_dir/proc" "$root_dir/sys"
    cp "$SCRIPT_DIR/build/pause" "$root_dir/bin/pause"
    workload="/bin/pause"
    devices="console,rng,balloon"
}

test_pci-acpi() {
    pause_before_run=10
    label_mmap=1
    transport=pci
    devices="console,rng,balloon"
}

# External vmlinux from a libkrunfw checkout, when present: the copied-kernel
# path (pure VMM overhead) against the zero-copy krunfw payload.
if [[ -f /home/jcorrent/libkrunfw/linux-6.12.109/vmlinux ]]; then
test_external-kernel() {
    pause_before_run=10
    label_mmap=1
    payload=external
    kernel="/home/jcorrent/libkrunfw/linux-6.12.109/vmlinux"
    cmdline="reboot=k panic=-1 panic_print=0 nomodule console=hvc0 rootfstype=virtiofs rw no-kvmapf"
    devices="console"
}
fi

# Attribution run: every mmap/mprotect/munmap/open/prctl with callstacks in
# strace.log, for correlating allocations against maps-annotated.txt.
test_minimal-strace() {
    strace=1
    label_mmap=1
    settle=30
    devices="console"
}
