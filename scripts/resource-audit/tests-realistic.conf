# Realistic-guest matrix: the chroot_vm / crun-krun workload model — a real
# distro rootfs (examples/rootfs_fedora) served over virtio-fs, krun-init
# launching a real shell workload, and chroot_vm's device/resource shape.
#
#     ./run-audit.sh --config tests-realistic.conf
#
# Regenerate the rootfs with `make -C examples rootfs` if it is missing.

COMMON_APPEND_CMDLINE="loglevel=7"

ROOTFS_FEDORA="$SCRIPT_DIR/../../examples/rootfs_fedora"

# The workload prints the readiness marker itself and then idles, so the
# driver's readiness gating keeps working with real guest binaries.
REAL_IDLE_CMD="echo AUDIT_GUEST_READY; exec /bin/sleep infinity"

if [[ -d "$ROOTFS_FEDORA" ]]; then

# chroot_vm.c's literal shape: 4 vCPUs, 4096 MiB, console + rootfs overlay +
# rng + balloon + vsock (TSI).
test_fedora-chroot() {
    pause_before_run=10
    label_mmap=1
    vcpus=4
    ram_mib=4096
    root_mode=dir
    root_dir="$ROOTFS_FEDORA"
    workload="/bin/sh"
    workload_args=("-c" "$REAL_IDLE_CMD")
    devices="console,rng,balloon,vsock"
}

# Realism at minimal scale: 1 vCPU, 512 MiB, console only.
test_fedora-chroot-lean() {
    pause_before_run=10
    label_mmap=1
    vcpus=1
    ram_mib=512
    root_mode=dir
    root_dir="$ROOTFS_FEDORA"
    workload="/bin/sh"
    workload_args=("-c" "$REAL_IDLE_CMD")
    devices="console"
}

# Real block I/O path: the guest mounts a formatted ext4 image and writes
# 32 MiB to it before reporting readiness, so sampling sees a quiescent guest
# with a populated page cache.
#
# The mount runs through build/blk-setup (a static helper doing raw
# mount(2)/write(2)) because the podman-exported rootfs carries foreign
# uids together with setuid bits: executing its /sbin/mount (setuid, owned
# by uid 4209569) flips euid away from root even when invoked by root, and
# libmount's fsopen() then fails with EPERM. Raw syscalls from the
# non-setuid helper run as euid 0 and work. Fixing the rootfs ownership
# needs host root (sudo chown -R 0:0 examples/rootfs_fedora); a properly
# owned or non-podman rootfs would let /sbin/mount work again.
test_fedora-chroot-blk() {
    pause_before_run=10
    label_mmap=1
    vcpus=1
    ram_mib=512
    root_mode=dir
    root_dir="$ROOTFS_FEDORA"
    cp "$SCRIPT_DIR/build/blk-setup" "$ROOTFS_FEDORA/tmp/blk-setup"
    workload="/tmp/blk-setup"
    devices="console,blk"
    truncate -s 256M "$TEST_DIR/blk.img"
    mkfs.ext4 -q -F "$TEST_DIR/blk.img"
    blk_img="$TEST_DIR/blk.img"
}

fi
