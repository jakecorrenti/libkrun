[package]
name = "aws-nitro"
version = "0.1.0"
edition = "2024"
description = "PID-1 init binary for libkrun AWS Nitro Enclave guest VMs"
license = "Apache-2.0"
repository = "https://github.com/libkrun/libkrun"

[[bin]]
name = "krun-init-awsnitro"
path = "src/main.rs"

[workspace]

[dependencies]
anyhow = "1.0.103"
nix = { version = "0.31.3", features = ["fs", "mount", "signal"] }
